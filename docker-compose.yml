services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    ports:
      - "55432:5432"
    volumes:
      - todo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["dev", "prod"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://todo:todo@db:5432/todo?schema=public
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      PORT: "4000"
      HOST: "0.0.0.0"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["prod"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    profiles: ["prod"]

volumes:
  todo_pg_data:
